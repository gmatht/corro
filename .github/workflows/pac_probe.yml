name: PAC probe
on:
  push:
    paths: ['.github/workflows/pac_probe.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          echo "=== does the runner use arm64e (pointer auth)?"
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          uname -m
          echo "=== a tiny objc_msgSend transmute test, the way the backend does it:"
          cat > /tmp/t.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          int main(void) {
              @autoreleasepool {
                  // (a) the runtime's own typed cast
                  id s = ((id(*)(id, SEL, const char *))objc_msgSend)(
                      (id)objc_getClass("NSString"), sel_registerName("stringWithUTF8String:"), "via-runtime-cast");
                  NSLog(@"%@", s);
                  // (b) address taken through a *const () like the Rust code does
                  void *raw = (void *)(uintptr_t)&objc_msgSend;
                  id s2 = ((id(*)(id, SEL, const char *))raw)(
                      (id)objc_getClass("NSString"), sel_registerName("stringWithUTF8String:"), "via-raw-ptr");
                  NSLog(@"%@", s2);
                  fprintf(stderr, "both paths ok\n");
              }
              return 0;
          }
          OBJC
          clang -framework Foundation /tmp/t.m -o /tmp/t && /tmp/t 2>&1 | tail -5
