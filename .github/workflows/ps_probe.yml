name: ps probe
on:
  push:
    paths: ['.github/workflows/ps_probe.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; n=[x for v in ds.values() for x in v if 'iPhone' in x['name']]; print(n[-1]['udid'])")"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "=== does 'simctl spawn ps -ax' list anything at all?"
          xcrun simctl spawn "$UDID" ps -ax 2>&1 | head -5
          echo "=== count:"
          xcrun simctl spawn "$UDID" ps -ax 2>/dev/null | wc -l
          echo "=== is SpringBoard listed?"
          xcrun simctl spawn "$UDID" ps -ax 2>/dev/null | grep -ci springboard || echo "no springboard"
          echo "=== does launchctl list show apps?"
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | head -5
