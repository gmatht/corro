name: iOS

# Builds and boots corro's iOS app on a hosted macOS runner.
#
# Why this exists: the iOS half of the port cannot be built on Linux (it needs
# Xcode and an Apple SDK — see rustxWidgets/docs/IOS_GUIDELINES.md §8b), and a
# *rented Mac* is the one option that removes that blocker without owning one.
# Real-device farms (LambdaTest App Live and friends) cannot help here: they
# install a signed .ipa, so they need a build before they can do anything.
#
# What this workflow gives you that a device farm does not:
#   * the Objective-C actually compiles (every shim, every delegate);
#   * `xcrun simctl` boots the app, so the first frame is real pixels;
#   * screenshots of the paths §9 lists as unverified (first frame, a tap,
#     typing in the formula bar).
#
# Simulator builds need no signing identity, so no secrets are required.
#
# ⚠️ UNTESTED — this workflow has never been executed.
#
# It was written and reviewed on a Linux host with no Xcode, no simulator, no
# GitHub credentials and no network to GitHub, so none of the following is
# confirmed: that the macos-14 image's Xcode accepts this project, that the
# nightly toolchain + rust-src steps resolve, that the simulator device query
# finds a name it expects, and that the app launches rather than crashing on an
# objc_msgSend signature mismatch. The YAML and every `run` step are checked
# for syntax by ios/corro/scripts/verify_all.sh, and nothing more.
#
# Expect to iterate once or twice on first run, most likely on the toolchain
# steps: ios/corro is a STANDALONE workspace (its own Cargo.lock), so the
# rust-cache action and the component install are the parts most likely to
# need adjusting. If it fails, the fix belongs here — not in the Rust code,
# which is verified separately by the linux job below.
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "rustxWidgets/rswidgets/src/backends/ios.rs"
      - "rustxWidgets/rswidgets/src/backends_ios_adapter.rs"
      - "src/gui/ios_backend.rs"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "rustxWidgets/rswidgets/src/backends/ios.rs"
      - "rustxWidgets/rswidgets/src/backends_ios_adapter.rs"
      - "src/gui/ios_backend.rs"

env:
  CARGO_TERM_COLORS: false

jobs:
  # ── The cheap half: the Rust iOS cfg paths, on Linux ────────────────
  # Runs first because it is fast and needs no macOS minutes. It is the same
  # check the repo script does, so a failure here means the port itself broke
  # rather than the Xcode plumbing.
  rust-ios-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: iOS cfg checks (simulator, arm64 device, 32-bit armv7s)
        run: ios/corro/scripts/check_rswidgets_ios.sh && ios/corro/scripts/check_corro_ios.sh

  # ── The real half: build + boot the app on a Mac ────────────────────
  build-and-boot:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The build needs nightly for -Zbuild-std (iOS targets have no prebuilt
      # std: armv7s is tier-3, and the 64-bit ones are not installed by
      # default). rust-src comes with it; build_ios.sh also self-checks this.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2

      # macos-14 runners are Apple silicon; the default Xcode covers
      # iphonesimulator arm64. Pin the deployment target to what current Xcode
      # accepts — the iOS 7.1.2 path needs an archived SDK no runner has
      # (IOS_GUIDELINES.md §0/§9).
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cargo --version

      - name: Build the app for the simulator
        env:
          IOS_DEPLOYMENT_TARGET: "12.0"
        run: ios/corro/build_ios.sh sim

      # `simctl` is where this stops being a compile check and starts being a
      # test: boot a device, install, launch, and let the shims run for real.
      # One UDID lookup for every later step ($GITHUB_ENV is inherited), rather
      # than repeating the same fragile parse four times.
      - name: Pick and boot a simulator
        run: |
          # Prefer the newest available iPhone. The inline python must stay on
          # ONE line (or be indented consistently): the multi-line form
          # previously collapsed in the YAML and died with IndentationError.
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; names=[x for v in ds.values() for x in v if 'iPhone' in x['name']]; print(names[-1]['udid'] if names else sys.exit('no iPhone simulator available'))")"
          echo "using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true          # already-booted is fine
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch corro
        # The build directory lives in /tmp, which is fine across steps within a
        # job (same runner), but the SIMULATOR can be reset between them - the
        # failure mode was 'simctl install ... No such file or directory' with
        # the bundle verifiably present on disk. Assert both ends before
        # installing so a future occurrence is unambiguous.
        env:
          # Symbolised panic frames: the .ips only carries offsets into the
          # (symbol-stripped) static library.
          RUST_BACKTRACE: "full"
        run: |
          APP=/tmp/corro_ios_build/iphonesimulator/corro.app
          echo "--- app bundle ---"
          ls -ld "$APP" "$APP/corro" 2>&1 || true
          file "$APP/corro" 2>&1 || true
          echo "--- simulator state ---"
          xcrun simctl list devices | grep -i "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b || true
          echo "--- installing ---"
          if ! xcrun simctl install "$SIM_UDID" "$APP" 2>&1; then
            echo "::error::simctl install failed (output above)"
            exit 1
          fi
          echo "install ok"
          # Launch detached, then read the app's output from the simulator's
          # own log below. `simctl launch --console-pty` in the background is
          # NOT usable: probed on the runner, a backgrounded --console-pty
          # produced an empty file, while a foreground `simctl spawn` printed
          # normally. Launching detached and grepping the unified log (which
          # captures our stderr writes and the crash) is the combination that
          # actually works.
          # Startup output is captured in the NEXT step, not here: attaching
          # --console requires the app to be stopped first, and the liveness
          # check below needs it running. Mixing the two in one step is what
          # made an earlier run report a process this script had itself killed.
          #
          # Launch detached and leave it up - this is the process the check
          # verifies.
          xcrun simctl launch "$SIM_UDID" com.corro.corro | tee /tmp/corro-launch.txt
          sleep 15
          echo "--- is the app process alive? ---"
          xcrun simctl spawn "$SIM_UDID" ps -ax 2>/dev/null | grep -i "[c]orro" || true
          echo "--- is the app process alive? ---"
          # `ps -ax` inside the simulator DOES list app processes; `pgrep` there
          # does not (it failed with NSPOSIXErrorDomain code=2 - pgrep is not
          # present in the simulator's environment, which made a perfectly
          # healthy launch look like a crash).
          xcrun simctl spawn "$SIM_UDID" ps -ax 2>/dev/null | grep -i "[c]orro" || true

      - name: Screenshot the first frame
        run: xcrun simctl io "$SIM_UDID" screenshot ios-first-frame.png

      # Runs AFTER the liveness check and the screenshot, because it stops the
      # app in order to attach --console.
      - name: Check the app is still alive (did not crash on launch)
        run: |
          # `ps -ax` inside the simulator is the check that works. Two earlier
          # probes gave FALSE NEGATIVES on a healthy launch:
          #   * `simctl spawn launchctl list` shows the simulator's own jobs;
          #   * `simctl spawn pgrep` fails outright - pgrep is not in the
          #     simulator's environment (NSPOSIXErrorDomain code=2).
          # Both reported "not running" while the app was up, which sent the
          # investigation after a crash that had not happened.
          if xcrun simctl spawn "$SIM_UDID" ps -ax 2>/dev/null | grep -qi "[c]orro"; then
            echo "corro is running"
            exit 0
          fi
          echo "--- processes containing 'corro' ---"
          xcrun simctl spawn "$SIM_UDID" ps -ax 2>/dev/null | grep -i corro || echo "(none)"
          echo "::error::corro is not running after launch"
          # Diagnose rather than just fail: crash reports first (they name the
          # signal and the faulting thread), then the console capture.
          "$GITHUB_WORKSPACE/ios/corro/scripts/report_crash.sh" "$SIM_UDID"
          # Symbolicate our own frames: the crash report carries raw addresses,
          # and the dSYM/object file is right there in the build directory.
          echo "--- symbolicated (atos) ---"
          LIB="/Users/runner/work/corro/corro/ios/corro/target/aarch64-apple-ios-sim/release/libcorro_ios.dylib"
          if [ -f "$LIB" ]; then
            grep -aE "^[[:space:]]+1[0-9a-f]{8,}$" /tmp/corro-console.log 2>/dev/null \
              | head -20 | while read -r addr; do
                atos -o "$LIB" -arch arm64 "0x${addr}" 2>/dev/null || true
              done
          else
            echo "(no libcorro_ios.dylib at $LIB)"
          fi
          exit 1

      - name: Capture the app's startup output
        if: always()
        run: |
          : > /tmp/corro-console.log
          xcrun simctl terminate "$SIM_UDID" com.corro.corro 2>/dev/null || true
          xcrun simctl launch --console "$SIM_UDID" com.corro.corro \
            > /tmp/corro-console.log 2>&1 &
          CONSOLE_PID=$!
          sleep 20
          kill "$CONSOLE_PID" 2>/dev/null || true
          wait "$CONSOLE_PID" 2>/dev/null || true
          echo "--- app output ---"
          tr -d '\000' < /tmp/corro-console.log | head -60 || echo "(no output)"

      # Rust-side logging goes to NSLog (IOS_GUIDELINES.md §9). A crash on an
      # objc_msgSend signature mismatch shows up here, not in a backtrace.
      - name: Dump the Rust log lines
        if: always()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact \
            --predicate 'eventMessage CONTAINS "rswidgets" OR eventMessage CONTAINS "corro"' \
            | tail -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-*.png
          if-no-files-found: warn
