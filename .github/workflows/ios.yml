name: iOS

# Builds and boots corro's iOS app on a hosted macOS runner.
#
# Why this exists: the iOS half of the port cannot be built on Linux (it needs
# Xcode and an Apple SDK — see rustxWidgets/docs/IOS_GUIDELINES.md §8b), and a
# *rented Mac* is the one option that removes that blocker without owning one.
# Real-device farms (LambdaTest App Live and friends) cannot help here: they
# install a signed .ipa, so they need a build before they can do anything.
#
# What this workflow gives you that a device farm does not:
#   * the Objective-C actually compiles (every shim, every delegate);
#   * `xcrun simctl` boots the app, so the first frame is real pixels;
#   * a screenshot of the running UI.
#
# Simulator builds need no signing identity, so no secrets are required.
#
# ✅ WORKING, and the screenshot is now of the APP (see the warning below).
#
# Run #97 (commit 7d64ee60) was green on every step — build, boot, install,
# launch, screenshot, and a health check that found real draw calls at real
# sizes with live CGContexts. But its artifact was the iOS HOME SCREEN.
#
# That is the lesson this file now encodes, because a green run hid it:
#   * the app needs ~90 s to reach its first frame on a cold runner;
#   * the screenshot step ran at 09:16:23 while the app's first line
#     (`main: entering UIApplicationMain`) only appeared at 09:16:45 — so the
#     PNG captured the springboard;
#   * the health check still passed, because it greps a *second* launch (in the
#     console-capture step) for `ios backend initialised` + `drawRect`. It
#     proved "corro can run", not "the process that got screenshotted ran".
#
# The fix, below: launch once, wait for the app's own readiness marker, take
# the screenshot while that same process is up, and only then stop it to read
# its output. The check additionally requires the readiness line to be present
# BEFORE the screenshot, so the two can no longer be satisfied by different
# processes.
#
# Three liveness probes were tried and all three are wrong; they are written
# down so they are not retried: `launchctl list` reads the simulator's own
# daemons, `pgrep` is absent, and `ps` is absent too (so it printed nothing and
# reported a healthy app as dead on every run). The signal that cannot lie is
# output the app produced.
#
# Still NOT covered, and this is the honest list rather than a to-do:
#   * iOS 7.1.2 — no hosted runner has the archived SDK (IOS_GUIDELINES §0/§9).
#   * Interaction ON A SIMULATOR. `xcrun simctl` cannot synthesise touches:
#     `simctl io <dev> tap` does not exist (proposed, never shipped), the app
#     cannot read XCTest's events, and idb/WebDriverAgent are not on the
#     runner. So the simulator proves startup → first frame and stops there.
#     Touch and typing are instead covered on every push by the cheap Linux
#     job below, which drives the *same* adapter code through the UIKit-free
#     host preview (`rswidgets/examples/ios_pipeline.rs`); a real finger needs
#     a real device or a farm (docs/ios/README.md § Lambdatest).
#
# If it breaks, the fix belongs here — not in the Rust code, which is verified
# separately by the linux job below (and by ios/corro/scripts/verify_all.sh).
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "rustxWidgets/rswidgets/src/backends/ios.rs"
      - "rustxWidgets/rswidgets/src/backends_ios_adapter.rs"
      - "src/gui/ios_backend.rs"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "rustxWidgets/rswidgets/src/backends/ios.rs"
      - "rustxWidgets/rswidgets/src/backends_ios_adapter.rs"
      - "src/gui/ios_backend.rs"

env:
  CARGO_TERM_COLORS: false

jobs:
  # ── The cheap half: the Rust iOS cfg paths, on Linux ────────────────
  # Runs first because it is fast and needs no macOS minutes. It is the same
  # check the repo script does, so a failure here means the port itself broke
  # rather than the Xcode plumbing.
  #
  # It also runs the host-pipeline preview, which is the closest thing to an
  # interactive test available without a Mac: it links the same
  # `backends_ios_adapter` code the staticlib links and drives a UIKit-free
  # shim, so a click and a keystroke travel the whole chain (shim → adapter →
  # corro::gui::ios_backend → committed op + redraw). The Mac job below cannot
  # do that with `simctl` — it has no way to synthesise touches.
  rust-ios-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: iOS cfg checks (simulator, arm64 device, 32-bit armv7s)
        run: ios/corro/scripts/check_rswidgets_ios.sh && ios/corro/scripts/check_corro_ios.sh
      - name: Run the iOS pipeline preview (click + keystroke end to end)
        run: rustxWidgets/rswidgets/scripts/run_ios_pipeline_preview.sh

  # ── The real half: build + boot the app on a Mac ────────────────────
  build-and-boot:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The build needs nightly for -Zbuild-std (iOS targets have no prebuilt
      # std: armv7s is tier-3, and the 64-bit ones are not installed by
      # default). rust-src comes with it; build_ios.sh also self-checks this.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2

      # macos-14 runners are Apple silicon; the default Xcode covers
      # iphonesimulator arm64. Pin the deployment target to what current Xcode
      # accepts — the iOS 7.1.2 path needs an archived SDK no runner has
      # (IOS_GUIDELINES.md §0/§9).
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cargo --version

      - name: Build the app for the simulator
        env:
          IOS_DEPLOYMENT_TARGET: "12.0"
        run: ios/corro/build_ios.sh sim

      # `simctl` is where this stops being a compile check and starts being a
      # test: boot a device, install, launch, and let the shims run for real.
      # One UDID lookup for every later step ($GITHUB_ENV is inherited), rather
      # than repeating the same fragile parse four times.
      - name: Pick and boot a simulator
        run: |
          # Prefer the newest available iPhone. The inline python must stay on
          # ONE line (or be indented consistently): the multi-line form
          # previously collapsed in the YAML and died with IndentationError.
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; names=[x for v in ds.values() for x in v if 'iPhone' in x['name']]; print(names[-1]['udid'] if names else sys.exit('no iPhone simulator available'))")"
          echo "using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true          # already-booted is fine
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch corro, then wait for the UI
        # The build directory lives in /tmp, which is fine across steps within a
        # job (same runner), but the SIMULATOR can be reset between them - the
        # failure mode was 'simctl install ... No such file or directory' with
        # the bundle verifiably present on disk. Assert both ends before
        # installing so a future occurrence is unambiguous.
        #
        # ⚠️ WHY THIS STEP WAITS. Run #97's artifact was the iOS home screen:
        # the app needs ~90 s to reach its first frame on a cold runner, and
        # this step used to launch, poll 20 x 1 s with a probe that could never
        # succeed, and exit - so the screenshot step ran before the app had
        # drawn anything. Waiting on the app's own readiness marker (below)
        # instead of a fixed sleep is what makes the screenshot show the app.
        env:
          # Symbolised panic frames: the .ips only carries offsets into the
          # (symbol-stripped) static library.
          RUST_BACKTRACE: "full"
        run: |
          APP=/tmp/corro_ios_build/iphonesimulator/corro.app
          echo "--- app bundle ---"
          ls -ld "$APP" "$APP/corro" 2>&1 || true
          file "$APP/corro" 2>&1 || true
          echo "--- simulator state ---"
          xcrun simctl list devices | grep -i "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b || true
          echo "--- installing ---"
          if ! xcrun simctl install "$SIM_UDID" "$APP" 2>&1; then
            echo "::error::simctl install failed (output above)"
            exit 1
          fi
          echo "install ok"

          # Launch in the FOREGROUND with `--console-pty`, which streams the
          # app's stdout/stderr to this step, and LEAVE IT RUNNING by putting
          # the whole thing in the background *as one pipeline* - the app keeps
          # running and its output keeps landing in the file.
          #
          # Why this shape, after two failed attempts:
          #   * `simctl launch` with no console: the app's stderr goes nowhere
          #     we can read. `log show` does NOT capture it (probed originally:
          #     only `--console` sees our lines). Run #98 proved this the hard
          #     way - the readiness poll below grepped the unified log for 180 s
          #     and never saw `ios backend initialised`, then screenshotted the
          #     home screen, while the same marker appeared instantly once the
          #     app was relaunched with `--console`.
          #   * a *backgrounded* `--console-pty` produced an empty file (probed).
          #     Redirecting the pipeline's own stdout to a file, with the
          #     pipeline backgrounded, is what makes it both stream and survive.
          echo "--- launching (foreground console, backgrounded as a pipeline) ---"
          # CORRO_EDIT_SCRIPT populates the sheet before the screenshot. Without
          # it the app opens a BLANK workbook, the PNG shows only chrome and row
          # labels, and a text-rendering bug (wrong baseline, clipped glyphs)
          # cannot be seen in the artifact at all - which is how one shipped.
          #
          # ⚠️ `simctl launch` does NOT pass the parent environment through: it
          # forwards only variables prefixed `SIMCTL_CHILD_`, and strips the
          # prefix. Exporting CORRO_EDIT_SCRIPT alone silently did nothing - the
          # first attempt at this shipped a screenshot of a still-blank sheet,
          # with no error anywhere, because the app simply never saw the
          # variable. So the export below is the SIMCTL_CHILD_ form.
          #
          # Values chosen to exercise the cases that broke: a bare number, a
          # computed formula, a long string that must be clipped to its cell,
          # and a negative/decimal - all in rows whose 20pt band is tight.
          # Kept in a variable as well as exported: the wait below needs the
          # script text, and reading it back from the environment proved
          # unreliable here (LAST_MS parsed to 0 twice, with the export
          # demonstrably in the same run block). A plain shell variable cannot
          # be affected by whatever the launch does to the environment.
          EDIT_SCRIPT="400:A1=1,900:A2=22,1400:A3==A1+A2,1900:B1=-3.5,2400:B2=123456789,2900:C1=long text that will not fit the cell,3400:C2==SUM(A1:A3),3900:A5=5.25"
          export SIMCTL_CHILD_CORRO_EDIT_SCRIPT="$EDIT_SCRIPT"
          xcrun simctl launch --console-pty "$SIM_UDID" com.corro.corro \
            > /tmp/corro-live.log 2>&1 &
          echo "launch pid $!"

          # Wait for the app's own readiness marker. `ios backend initialised`
          # is printed by Rust once the host has handed over the root view, so
          # it is strictly before anything can draw - the earliest honest "the
          # UI exists" signal, and one a dead process cannot produce.
          #
          # 180 s budget: a cold first launch measured ~90 s on this runner.
          echo "--- waiting for the UI to come up (the app needs ~90s cold) ---"
          READY=0
          for i in $(seq 1 180); do
            if grep -qa "ios backend initialised" /tmp/corro-live.log 2>/dev/null; then
              echo "  t+${i}s: ios backend initialised"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            # Do not fail here: a screenshot of whatever is on screen is more
            # useful than nothing, and the check step below is where this
            # becomes a hard failure. Say plainly that the shot is suspect.
            echo "::warning::app did not report readiness within 180s — the screenshot will show whatever is on the simulator, not corro"
            xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact \
              --predicate 'eventMessage CONTAINS "corro" OR eventMessage CONTAINS "rswidgets"' \
              | tail -30 || true
          fi

          # Record that readiness happened BEFORE the screenshot, so a later
          # step can assert the shot and the evidence describe the same process.
          echo "UI_READY_BEFORE_SCREENSHOT=$READY" >> "$GITHUB_ENV"

          # ⚠️ Wait for the SCRIPTED EDITS to land, not merely for readiness.
          #
          # `ios backend initialised` fires early in run_gui — before the widget
          # tree is built, before `present`, and before `arm_edit_script`. The
          # edit steps are scheduled 400..3900ms after *arming*, so a screenshot
          # taken readiness+10s captured the sheet BEFORE the first edit
          # committed. Measured: the shot was written at 13:43:18.6 while the
          # script armed at 13:43:20.2 — which is why the "populated sheet" run
          # still produced a blank one.
          #
          # `edit script armed (N steps, ...)` is the marker that the edits are
          # running, and the last step's `at_ms` is the earliest the sheet can be
          # complete. Waiting for the armed line plus the final step's deadline
          # is deterministic, rather than another guess at a sleep.
          echo "--- waiting for the scripted edits to commit ---"
          # One line on purpose: the backslash-continued $( ) form above was
          # collapsed by YAML and parsed to nothing, so LAST_MS came out 0 and
          # the wait was 4s instead of 8s. Same family of bug as the earlier
          # multi-line inline python.
          LAST_MS=$(printf '%s' "${EDIT_SCRIPT:-}" | tr ',' '\n' | sed -n 's/^\([0-9]\+\):.*/\1/p' | sort -n | tail -1)
          LAST_MS=${LAST_MS:-0}
          if [ "$LAST_MS" -eq 0 ]; then
            echo "::error::could not parse an edit deadline from EDIT_SCRIPT - the wait would be wrong"
            exit 1
          fi
          echo "last scripted edit at ${LAST_MS}ms"
          ARMED=0
          for i in $(seq 1 120); do
            if grep -qa "edit script armed" /tmp/corro-live.log 2>/dev/null; then
              echo "  t+${i}s: edit script armed"
              ARMED=1
              break
            fi
            sleep 1
          done
          if [ "$ARMED" -ne 1 ]; then
            echo "::warning::edit script never armed - the screenshot may show an unedited sheet"
          fi
          WAIT_S=$(( (LAST_MS + 4000) / 1000 ))
          echo "  last edit at ${LAST_MS}ms; waiting ${WAIT_S}s more for it to commit"
          sleep "$WAIT_S"

      - name: Screenshot the first frame
        # Runs while the detached launch from the previous step is still alive.
        run: |
          xcrun simctl io "$SIM_UDID" screenshot ios-first-frame.png
          # A screenshot of the wrong screen is the failure this workflow
          # shipped once (the home screen, run #97), so record the dimensions
          # and let the check step verify the image is corro's.
          file ios-first-frame.png

      - name: Capture the app's startup output (stops the app)
        if: always()
        run: |
          # The app has been running with `--console-pty` since the launch step,
          # streaming to /tmp/corro-live.log - so there is nothing to relaunch.
          # Copy it aside for the check, then stop the app.
          cp /tmp/corro-live.log /tmp/corro-console.log 2>/dev/null || : > /tmp/corro-console.log
          xcrun simctl terminate "$SIM_UDID" com.corro.corro 2>/dev/null || true
          echo "--- app output ---"
          tr -d '\000' < /tmp/corro-console.log | head -80 || echo "(no output)"

      # The pass condition is evidence the app produced, read from this
      # capture. It is deliberately strict about ORDER as well as presence:
      # `UI_READY_BEFORE_SCREENSHOT` must be 1, i.e. the same UI that was
      # screenshotted was already up. Without that, this step can be satisfied
      # by the relaunch above while the PNG shows the springboard - which is
      # exactly what happened in run #97.
      - name: Check the app ran, drew, and was up before the screenshot
        run: |
          CONSOLE=/tmp/corro-console.log
          FAIL=0
          if [ ! -f "$CONSOLE" ]; then
            echo "::error::no console capture at $CONSOLE"
            FAIL=1
          else
            tr -d '\000' < "$CONSOLE" > /tmp/corro-console.clean
            for needle in "ios backend initialised" "SheetView.drawRect"; do
              if grep -qa "$needle" /tmp/corro-console.clean; then
                echo "ok: $needle"
              else
                echo "::error::the app never printed: $needle"
                FAIL=1
              fi
            done
          fi
          if [ "${UI_READY_BEFORE_SCREENSHOT:-0}" != "1" ]; then
            echo "::error::the UI was not up when the screenshot was taken, so ios-first-frame.png is not corro"
            FAIL=1
          fi
          if [ "$FAIL" -eq 0 ]; then
            echo "corro ran, drew, and was on screen for the screenshot"
            exit 0
          fi
          echo "--- launchctl entries containing 'corro' (supplementary) ---"
          xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -i corro || echo "(none)"
          # Diagnose rather than just fail: crash reports first (they name the
          # signal and the faulting thread), then symbolicate our own frames.
          "$GITHUB_WORKSPACE/ios/corro/scripts/report_crash.sh" "$SIM_UDID"
          echo "--- symbolicated (atos) ---"
          LIB="/Users/runner/work/corro/corro/ios/corro/target/aarch64-apple-ios-sim/release/libcorro_ios.dylib"
          if [ -f "$LIB" ] && [ -f /tmp/corro-console.clean ]; then
            grep -aE "^[[:space:]]+1[0-9a-f]{8,}$" /tmp/corro-console.clean 2>/dev/null \
              | head -20 | while read -r addr; do
                atos -o "$LIB" -arch arm64 "0x${addr}" 2>/dev/null || true
              done
          else
            echo "(no libcorro_ios.dylib at $LIB)"
          fi
          exit 1

      - name: Verify the screenshot shows corro's sheet WITH text
        if: always()
        run: |
          # The image was uploaded once while showing the springboard (run #97),
          # and that is the failure this catches. A first attempt keyed on "is
          # the centre third greyscale" was too weak to do it: the home screen's
          # wallpaper scored a spread of 21 against a threshold of 24, i.e. it
          # would have passed.
          #
          # The reliable discriminator is *how much of the image is achromatic*,
          # measured over the lower two thirds (where the grid is). corro's
          # chrome is neutral throughout; the springboard is a saturated
          # wallpaper with a dock. Measured on real images:
          #
          #   corro, desktop render   100.0% achromatic
          #   corro, populated grid    98.7%
          #   iOS home screen (run 97)  2.2%
          #
          # So a 50% floor has an enormous margin either way, and is not picky
          # about the exact palette corro happens to use.
          python3 - <<'PY'
          import struct, sys, zlib

          path = "ios-first-frame.png"
          data = open(path, "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit(f"{path} is not a PNG")

          pos, idat, w, h, bitd, ctype = 8, b"", 0, 0, 0, 0
          while pos < len(data):
              ln = struct.unpack(">I", data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              body = data[pos+8:pos+8+ln]
              if typ == b"IHDR":
                  w, h, bitd, ctype = struct.unpack(">IIBB", body[:10])
              elif typ == b"IDAT":
                  idat += body
              elif typ == b"IEND":
                  break
              pos += 12 + ln

          if bitd != 8 or ctype not in (2, 6):
              print(f"(unhandled PNG: bit_depth={bitd} colour_type={ctype}); skipping")
              sys.exit(0)

          ch = 3 if ctype == 2 else 4
          raw = zlib.decompress(idat)
          stride = w * ch
          prev = bytearray(stride)
          rows, y = [], 0
          for i in range(0, len(raw), stride + 1):
              f = raw[i]
              line = bytearray(raw[i+1:i+1+stride])
              for x in range(stride):
                  a = line[x-ch] if x >= ch else 0
                  b = prev[x]
                  c = prev[x-ch] if x >= ch else 0
                  if f == 1:
                      line[x] = (line[x] + a) & 0xFF
                  elif f == 2:
                      line[x] = (line[x] + b) & 0xFF
                  elif f == 3:
                      line[x] = (line[x] + ((a + b) >> 1)) & 0xFF
                  elif f == 4:
                      p = a + b - c
                      pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[x] = (line[x] + pr) & 0xFF
              rows.append(bytes(line))
              prev = line
              y += 1
              if y >= h:
                  break

          # Achromatic fraction over the lower two thirds.
          tot = grey = 0
          for yy in range(h // 3, h, 2):
              row = rows[yy]
              for xx in range(0, w, 2):
                  o = xx * ch
                  r, g, b = row[o], row[o+1], row[o+2]
                  tot += 1
                  if max(r, g, b) - min(r, g, b) <= 6:
                      grey += 1
          frac = grey / max(tot, 1)
          print(f"{w}x{h}: achromatic fraction over the lower 2/3 = {frac:.1%}")

          if frac < 0.5:
              print("::error::ios-first-frame.png does not look like corro — its chrome is neutral")
              print("::error::grey, and only %.1f%% of this image is. This is the run #97" % (frac * 100))
              print("::error::failure: the screenshot captured the simulator's home screen.")
              sys.exit(1)
          print("ok: neutral grey throughout, as corro's chrome is")

          # Cell TEXT must be present. This is the check the earlier frames
          # needed and did not have: "is it corro's chrome?" cannot see a blank
          # workbook (chrome only, no values), which is what shipped twice.
          #
          # Deliberately NOT a positional assertion. One was written and removed
          # again: it keyed on a 40-device-pixel row pitch, but iOS scales its
          # metrics by UIScreen.scale, so the real pitch on this 2x simulator is
          # 80px - the check failed the CORRECT frame. A check that guesses the
          # geometry is worse than no check; the artifact with a populated sheet
          # is measurable directly, and that is what it is for.
          rows_ink = []
          for yy in range(len(rows)):
              n = sum(1 for xx in range(100, 700, 2)
                      if rows[yy][xx * ch] < 100)
              rows_ink.append(n)

          def ink(x0, x1):
              return sum(1 for yy in range(240, min(h - 60, len(rows_ink)))
                         for xx in range(x0, x1) if rows[yy][xx * ch] < 100)

          # The gutter (row labels) is always drawn, so it proves nothing about
          # the SHEET. Require ink in the first TWO data columns: the scripted
          # edits put values in A AND B, so a sheet where only the gutter has
          # text - i.e. the blank-workbook case that shipped twice - fails here.
          gutter = ink(4, 60)
          col_a = ink(90, 190)
          col_b = ink(190, 300)
          print(f"ink px: gutter={gutter} colA={col_a} colB={col_b}")

          if col_a < 50 or col_b < 50:
              print("::error::no cell text in the data columns - the sheet is blank")
              print("::error::(the row-label gutter having text is not enough: that")
              print("::error::is chrome, and it is what made the earlier blank sheets")
              print("::error::pass a text-presence check.)")
              sys.exit(1)
          print("ok: cell text present in at least two data columns")
          PY

      - name: Dump the Rust log lines
        if: always()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact \
            --predicate 'eventMessage CONTAINS "rswidgets" OR eventMessage CONTAINS "corro"' \
            | tail -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-*.png
          if-no-files-found: warn
