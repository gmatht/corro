name: sdk probe3
on:
  push:
    paths: ['.github/workflows/sdk_probe3.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          set -x
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          # Make a shim libCoreGraphics.tbd that re-exports the framework, which
          # is the documented way to turn a framework into an -l-able library.
          mkdir -p /tmp/shim
          FW="$SDK/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics.tbd"
          ls -la "$FW" 2>&1 | head -2
          cp "$FW" /tmp/shim/libCoreGraphics.tbd
          echo "[A] -lCoreGraphics with the shim dir on -L:"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c \
            -L/tmp/shim -lCoreGraphics -o /tmp/tA 2>&1 | head -3 && echo "    -> ok"
