name: sdk probe2
on:
  push:
    paths: ['.github/workflows/sdk_probe2.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          echo "[1] both -framework CoreGraphics AND -lCoreGraphics:"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c \
            -framework CoreGraphics -lCoreGraphics -o /tmp/t1 2>&1 | head -3
          echo "[2] -lCoreGraphics alone:"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c \
            -lCoreGraphics -o /tmp/t2 2>&1 | head -3
          echo "[3] -framework CoreGraphics alone:"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c \
            -framework CoreGraphics -o /tmp/t3 2>&1 | head -3 && echo "    ok"
