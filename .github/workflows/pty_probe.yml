name: pty probe
on:
  push:
    paths: ['.github/workflows/pty_probe.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; n=[x for v in ds.values() for x in v if 'iPhone' in x['name']]; print(n[-1]['udid'])")"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Build nothing; just test whether --console-pty output survives
          # when backgrounded, using a stock simulator binary that prints.
          echo "=== test: backgrounded --console-pty"
          : > /tmp/a.log
          xcrun simctl spawn --console-pty "$UDID" /bin/echo hello-from-spawn >> /tmp/a.log 2>&1 &
          sleep 5
          echo "a.log:"; cat /tmp/a.log 2>/dev/null || echo "(empty)"
          echo "=== test: foreground --console-pty"
          xcrun simctl spawn --console-pty "$UDID" /bin/echo hello-foreground 2>&1 | head -2
          echo "=== test: no --console-pty, backgrounded"
          xcrun simctl spawn "$UDID" /bin/echo hello-plain >> /tmp/b.log 2>&1 || true
          echo "b.log:"; cat /tmp/b.log 2>/dev/null || echo "(empty)"
