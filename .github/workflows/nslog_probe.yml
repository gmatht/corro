name: NSLog probe
on:
  push:
    paths: ['.github/workflows/nslog_probe.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          cat > /tmp/n.m <<'OBJC'
          #import <Foundation/Foundation.h>
          int main(void) {
              @autoreleasepool {
                  char *fmt = "%s";
                  char *msg = "hello from NSLog";
                  fprintf(stderr, "before variadic\n"); fflush(stderr);
                  // NSLog(fmt, msg);                     // the form that crashed
                  fprintf(stderr, "skipped variadic\n"); fflush(stderr);
                  NSLog(@"literal format %s", "literal-ok");
                  fprintf(stderr, "after literal\n"); fflush(stderr);
                  NSLog(@"plain literal with no args");
                  fprintf(stderr, "after plain\n"); fflush(stderr);
              }
              return 0;
          }
          OBJC
          clang -framework Foundation /tmp/n.m -o /tmp/n && /tmp/n
