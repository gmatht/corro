name: NSLog probe
on:
  push:
    paths: ['.github/workflows/nslog_probe.yml']
jobs:
  p:
    runs-on: macos-14
    steps:
      - run: |
          cat > /tmp/n.m <<'OBJC'
          #import <Foundation/Foundation.h>
          int main(void) {
              @autoreleasepool {
                  char *fmt = "%s";
                  char *msg = "hello from NSLog";
                  // The candidate replacement: a LITERAL format with the
                  // message as a %s argument, which is the only variadic form
                  // that survived, plus os_log for comparison.
                  NSLog(@"%@", @"via-percent-at");
                  NSLog(@"literal %s", "via-percent-s");
                  fprintf(stderr, "survived both\n"); fflush(stderr);
              }
              return 0;
          }
          OBJC
          clang -framework Foundation /tmp/n.m -o /tmp/n && /tmp/n
