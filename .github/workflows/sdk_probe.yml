name: SDK probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Inspect the iOS SDK for CoreGraphics / objc / iconv
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "SDK=$SDK"
          echo "--- as a framework:"
          ls -d "$SDK/System/Library/Frameworks/CoreGraphics.framework" 2>&1 | head -2
          echo "--- as a plain library (libCoreGraphics.tbd):"
          ls "$SDK/usr/lib/libCoreGraphics.tbd" 2>&1 | head -2
          echo "--- objc:"
          ls "$SDK/usr/lib/libobjc.tbd" "$SDK/usr/lib/libobjc.A.tbd" 2>&1 | head -3
          echo "--- iconv:"
          ls "$SDK/usr/lib/libiconv.tbd" 2>&1 | head -2
          echo "--- which -l flags resolve: try a link"
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          echo "[a] -lCoreGraphics :"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c -lCoreGraphics -o /tmp/t1 2>&1 | head -2
          echo "[b] -framework CoreGraphics :"
          clang -target arm64-apple-ios14.0.0-simulator -isysroot "$SDK" /tmp/t.c -framework CoreGraphics -o /tmp/t2 2>&1 | head -2 && echo "    -> ok"
