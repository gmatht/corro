[workspace]
members = ["balance-core", "rustxWidgets/rswidgets"]

# Vendored Win95-compatibility patches (see vendor/*/  — the patches resolve
# Vista+/Win2000+ APIs dynamically instead of importing them statically, which
# would make the Windows 95 loader reject the exe):
#   notify    — KERNEL32!CancelIo + ReadDirectoryChangesW missing on Win95
#   chrono    — KERNEL32!GetTimeZoneInformationForYear (Vista+)
#   crossterm — USER32!ToUnicodeEx (Win2000+)
[patch.crates-io]
notify = { path = "vendor/notify" }
chrono = { path = "vendor/chrono" }
crossterm = { path = "vendor/crossterm" }
# Win95 pancurses support: pdcurses-sys build.rs compiles the win32 console
# flavor (ANSI APIs; win32a's ExtTextOutW is a no-op stub on Win95) without
# PDC_WIDE for rust9x targets; pancurses selects its win32 module for the
# same targets. See vendor/*/ and tools/zig-cc-msvc586.
pdcurses-sys = { path = "vendor/pdcurses-sys" }
pancurses = { path = "vendor/pancurses" }
# Win95 native GUI (nwg): upstream statically imports four APIs that do not
# exist on Windows 95 (GetAncestor, MonitorFromWindow/GetMonitorInfoW,
# CreateActCtxW/ActivateActCtx) plus, via the file-dialog feature, the Win7+
# IFileDialog COM path (SHELL32!SHCreateItemFromParsingName). A single missing
# static import makes the whole exe fail to load on 9x, so the vendored copy
# replaces them with Win95 equivalents and switches the many *W APIs that Win9x
# exports as no-op stubs to their ANSI implementations. See
# vendor/native-windows-gui/README-WIN95.md.
native-windows-gui = { path = "vendor/native-windows-gui" }

[package]
name = "corro"
version = "0.7.0"
edition = "2021"
default-run = "corro"

# ratatui =  terminal UI (default)
# gui      =  rswidgets desktop GUI (GTK on Linux/Windows), and the base for
#             the other rswidgets hosts: the pancurses, combined-gui and
#             wasm builds below, plus the Android backend.
#
# Android uses the `gui` feature too: the corro_android cdylib
# (android/corro) builds about-corro with `features = ["gui"]` for the
# Android target triple against the NDK, and on `target_os = "android"`
# src/gui/android_backend.rs roots the same widget tree in the Activity's
# content view rather than a desktop toplevel. See
# rustxWidgets/docs/ANDROID_GUIDELINES.md and `cargo run --example android-ui
# --features gui` for the tree itself.
[features]
default = ["ratatui"]
nightly = []
ratatui = ["dep:ratatui", "dep:crossterm", "dep:unicode-truncate", "dep:unicode-segmentation"]
# The `gtk` feature chain is a Linux/Windows dependency; iOS (and Android)
# take the same `gui` feature but must not compile the GTK adapter at all, so
# the rswidgets/gtk + gtk_dynamic_loader halves are target-gated below the
# feature list via `[target.'cfg(...)'.dependencies]`-style arms in the
# rswidgets manifest. Enabling `rswidgets/gtk` on iOS would be harmless
# (rswidgets gates the adapter on `target_os = "linux"`), but
# `gtk_dynamic_loader` would then be linked into the app for nothing.
#
# Android/iOS host crates do NOT use this feature: they depend on corro with
# `features = ["gui-mobile"]` (below), which selects the same shared GUI
# pipeline without the GTK half. See ios/corro and android/corro.
# `gui-core` is the widget-pipeline half of `gui` with no toolkit: the shared
# spreadsheet GUI (src/gui) compiles against rswidgets' *common* wrapper types
# and never names a toolkit, so a headless or mobile host can select it without
# pulling in GTK. `gui` = `gui-core` + the GTK half.
#
# Why it exists: `zork` (the headless in-memory model) needs src/gui, but
# enabling `gui` for it would drag GTK onto a terminal build. Splitting the
# gate lets both point at the same code.
gui-core = ["dep:rswidgets", "rswidgets/headless"]
gui = ["gui-core", "rswidgets/gtk", "dep:gtk_dynamic_loader"]
# iOS/Android: the shared GUI pipeline without the GTK half. This is what the
# mobile host crates (ios/corro, android/corro) enable;
# `src/gui/ios_backend.rs` / `src/gui/android_backend.rs` are gated on
# `target_os` on top of it.
#
# `rswidgets/ios` is enabled unconditionally here (it is a no-op unless
# `target_os = "ios"`, where it is what selects the UIKit backend); the GTK
# half is simply absent, which is the whole point on those targets.
#
# For host-side checks on a desktop (`cargo check --features gui-mobile`, and
# `--example ios-ui`) a non-mobile backend is still needed, or rswidgets has
# no `backends::init` at all. Those live in the target-gated table below, so
# a real iOS/Android build never sees them.
gui-mobile = ["dep:rswidgets", "rswidgets/ios", "rswidgets/headless"]
# macOS: the shared GUI pipeline against the *AppKit* adapter, with no GTK
# half. This is the desktop-native counterpart of `gui-mobile`, and it is what
# a macOS host crate (or `scripts/check_corro_macos.sh`) depends on.
#
# Why it is separate from `gui`: `gui` resolves `rswidgets/gtk` +
# `gtk_dynamic_loader`, which cannot link on an Apple target at all. So a Mac
# build cannot use `gui`, and before this feature existed there was *no* cargo
# feature that put corro on a native macOS widget backend — `src/gui/
# macos_backend.rs` was only ever reachable by depending on `gui-mobile`, which
# is misleading (it is a desktop) and gives a Mac build the iOS feature too.
#
# `rswidgets/macos` is a no-op feature (the adapter is gated on
# `target_os = "macos"`, not on the feature), exactly like `rswidgets/ios`; it
# is named here so a host can write the same explicit `features = [...]` line
# it uses on the other Apple platforms. `rswidgets/headless` supplies the
# headless `backends::init` the shared GUI code expects.
gui-macos = ["dep:rswidgets", "rswidgets/macos", "rswidgets/headless"]
# Desktop stand-in for the mobile GUI: `gui-mobile` plus the Linux/Windows
# backend, so `--example ios-ui` / `--example android-ui` build and run on a
# workstation. Never used by the app bundles.
gui-mobile-host = ["gui-mobile", "gui"]
# Desktop stand-in for the macOS GUI: `gui-macos` plus the Linux/Windows
# backend, so the AppKit widget tree and the macOS menu model can be built and
# inspected on a workstation (and, crucially, tested headlessly on Linux CI).
# Never used by a real .app bundle, which depends on `gui-macos` alone.
gui-macos-host = ["gui-macos", "gui"]
wasm = ["dep:rswidgets"]
pancurses = ["rswidgets/pancurses"]
# Headless zork backend (experiment): the in-memory model + text REPL in
# rustxWidgets, selected here so `cargo check --features zork` can ask whether
# corro's GUI pipeline actually runs against it.
zork = ["gui-core", "rswidgets/zork"]
gtk = ["gui"]
combined-gui = ["gui", "pancurses"]
# Win95 GUI build: link the nwg GUI as a /SUBSYSTEM:WINDOWS exe (entered via
# WinMain, no console window). The rust9x link flags live in build95-gui.sh;
# this feature only selects the WinMain entry point in src/main.rs. Never
# enable it for the console TUI builds.
gui-subsystem = []
# Converge corro's terminal spreadsheet view onto rustxWidgets
# (backend-agnostic SpreadsheetModel), keeping `src/ui` as the reference fork.
rswidgets-term = ["gui", "rswidgets/ratatui", "rswidgets/headless"]

[dependencies]
ratatui = { version = "0.29", optional = true }
unicode-width = "0.2.0"
unicode-truncate = { version = "1", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-segmentation = { version = "1", optional = true }
rswidgets = { path = "rustxWidgets/rswidgets", optional = true, default-features = false }
# GTK loader: desktop only. On iOS/Android the `gui` feature is still used
# (it selects the shared gui_backend pipeline), but this crate must not even
# resolve the GTK loader symbol there.
gtk_dynamic_loader = { path = "rustxWidgets/gtk_dynamic_loader", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.37"
balance-core = { path = "balance-core" }
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2"
num-complex = "0.4"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "7"
libc = "0.2"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
# Android resource generation / Java shims live in android/corro, which
# depends on rswidgets directly; rswidgets' own `android` module is selected
# by `target_os` there, not by a feature.

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

