[workspace]
members = ["balance-core", "rustxWidgets/rswidgets"]

# Vendored Win95-compatibility patches (see vendor/*/  — the patches resolve
# Vista+/Win2000+ APIs dynamically instead of importing them statically, which
# would make the Windows 95 loader reject the exe):
#   notify    — KERNEL32!CancelIo + ReadDirectoryChangesW missing on Win95
#   chrono    — KERNEL32!GetTimeZoneInformationForYear (Vista+)
#   crossterm — USER32!ToUnicodeEx (Win2000+)
[patch.crates-io]
notify = { path = "vendor/notify" }
chrono = { path = "vendor/chrono" }
crossterm = { path = "vendor/crossterm" }
# Win95 pancurses support: pdcurses-sys build.rs compiles the win32 console
# flavor (ANSI APIs; win32a's ExtTextOutW is a no-op stub on Win95) without
# PDC_WIDE for rust9x targets; pancurses selects its win32 module for the
# same targets. See vendor/*/ and tools/zig-cc-msvc586.
pdcurses-sys = { path = "vendor/pdcurses-sys" }
pancurses = { path = "vendor/pancurses" }

[package]
name = "corro"
version = "0.6.0"
edition = "2021"
default-run = "corro"

[features]
default = ["ratatui"]
nightly = []
ratatui = ["dep:ratatui", "dep:crossterm", "dep:unicode-truncate", "dep:unicode-segmentation"]
gui = ["dep:rswidgets", "rswidgets/gtk", "rswidgets/headless", "dep:gtk_dynamic_loader"]
gtk4 = ["gui", "rswidgets/gtk4-rs"]
wasm = ["dep:rswidgets"]
pancurses = ["rswidgets/pancurses"]
gtk = ["gui"]
combined-gui = ["gui", "pancurses"]
# Converge corro's terminal spreadsheet view onto rustxWidgets
# (backend-agnostic SpreadsheetModel), keeping `src/ui` as the reference fork.
rswidgets-term = ["gui", "rswidgets/ratatui", "rswidgets/headless"]

[dependencies]
ratatui = { version = "0.29", optional = true }
unicode-width = "0.2.0"
unicode-truncate = { version = "1", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-segmentation = { version = "1", optional = true }
rswidgets = { path = "rustxWidgets/rswidgets", optional = true, default-features = false }
gtk_dynamic_loader = { path = "rustxWidgets/gtk_dynamic_loader", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.37"
balance-core = { path = "balance-core" }
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2"
num-complex = "0.4"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "7"
libc = "0.2"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[patch."https://github.com/gtk-rs/gtk-rs-core"]
glib-sys = { path = "/root/tmp/gtk4-rs/generated/glib-sys-dlopen" }
gobject-sys = { path = "/root/tmp/gtk4-rs/generated/gobject-sys-dlopen" }
gio-sys = { path = "/root/tmp/gtk4-rs/generated/gio-sys-dlopen" }
cairo-sys-rs = { path = "/root/tmp/gtk4-rs/generated/cairo-sys-rs-dlopen" }
pango-sys = { path = "/root/tmp/gtk4-rs/generated/pango-sys-dlopen" }
gdk-pixbuf-sys = { path = "/root/tmp/gtk4-rs/generated/gdk-pixbuf-sys-dlopen" }
graphene-sys = { path = "/root/tmp/gtk4-rs/generated/graphene-sys-dlopen" }

[[bin]]
name = "render_ref"
required-features = ["ratatui"]

[[bin]]
name = "pgo_mix_benchmark"
required-features = ["ratatui"]

[[bin]]
name = "repro_tmp_move"
required-features = ["ratatui"]

[[bin]]
name = "test_render"
required-features = ["ratatui"]

[[bin]]
name = "gtk_a11y_dump"
required-features = ["gui"]

[[example]]
name = "dump_render"
required-features = ["ratatui"]

[[example]]
name = "render_date"
required-features = ["ratatui"]

[[example]]
name = "test_ref"
required-features = ["ratatui"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.balance-core]
opt-level = 2

[profile.release.package.corro]
opt-level = 2

[profile.release.package.ratatui]
opt-level = 2

[profile.release.package.compact_str]
opt-level = 2

[profile.tiny]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Win95 build profile (used by build95.sh/run95.sh): dev-like iteration speed,
# but panic = "abort" — unwind support needs at least VC8 (VS2005) and the
# vintage rust9x toolchain links the VC6 (MSVC 6.0) CRT, so an unwinding
# panic aborts with "abnormal program termination" before the TUI starts.
[profile.win95]
inherits = "dev"
panic = "abort"
# Win9x: the optional UB/overflow debug checks (assert_unsafe_precondition)
# fire spuriously in std paths on 9x (e.g. a ptr::write alignment precondition
# aborting at first redraw) and add runtime overhead; the debug checks are
# explicitly "optional and cannot be relied on for safety".
debug-assertions = false
overflow-checks = false

# Override the inherited O2 per-package settings from release back to "z".
[profile.tiny.package.balance-core]
opt-level = "z"

[profile.tiny.package.corro]
opt-level = "z"

[profile.tiny.package.ratatui]
opt-level = "z"

[profile.tiny.package.compact_str]
opt-level = "z"

