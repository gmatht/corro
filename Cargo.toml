[[example]]
name = "test-ref"
path = "examples/test_ref.rs"
required-features = ["ratatui"]

# Builds the rswidgets widget tree the Android GUI path builds (same
# children, same order), standing in for the Activity's root layout so the
# UI structure can be inspected on a desktop. Needs the GUI feature; on
# Android the tree is rooted at the Activity content view instead (see
# src/gui/android_backend.rs and android/corro). Android resources for that
# tree come from rswidgets::android_generator via android/corro/build.rs.
[[example]]
name = "android-ui"
path = "examples/android_ui.rs"
required-features = ["gui"]

# Builds the same widget tree the iOS GUI path builds, standing in for the
# app's root UIView so the UI structure can be inspected on a desktop. Needs
# the GUI feature; on iOS the tree is rooted at the view controller's view
# instead (see src/gui/ios_backend.rs and ios/corro). The iOS menu *model*
# the host renders is printed too.
[[example]]
name = "ios-ui"
path = "examples/ios_ui.rs"
required-features = ["gui-mobile-host"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.balance-core]
opt-level = 2

[profile.release.package.corro]
opt-level = 2

[profile.release.package.ratatui]
opt-level = 2

[profile.release.package.compact_str]
opt-level = 2

[profile.tiny]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Win95 build profile (used by build95.sh/run95.sh): dev-like iteration speed,
# but panic = "abort" — unwind support needs at least VC8 (VS2005) and the
# vintage rust9x toolchain links the VC6 (MSVC 6.0) CRT, so an unwinding
# panic aborts with "abnormal program termination" before the TUI starts.
[profile.win95]
inherits = "dev"
panic = "abort"
# Win9x: the optional UB/overflow debug checks (assert_unsafe_precondition)
# fire spuriously in std paths on 9x (e.g. a ptr::write alignment precondition
# aborting at first redraw) and add runtime overhead; the debug checks are
# explicitly "optional and cannot be relied on for safety".
debug-assertions = false
overflow-checks = false

# Override the inherited O2 per-package settings from release back to "z".
[profile.tiny.package.balance-core]
opt-level = "z"

[profile.tiny.package.corro]
opt-level = "z"

[profile.tiny.package.ratatui]
opt-level = "z"

[profile.tiny.package.compact_str]
opt-level = "z"

