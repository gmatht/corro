[package]
name = "corro_ios"
version = "0.7.0"
edition = "2021"
# Standalone crate (NOT in the corro workspace): it builds for Apple targets
# with its own feature set, mirroring android/corro.
[workspace]

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# `gui-mobile` is the shared GUI pipeline without the GTK half: exactly the
# feature set the iOS backend needs. See Cargo.toml at the repo root.
corro = { path = "../..", default-features = false, features = ["gui-mobile"] }
# rswidgets is depended on directly (not only through corro) so the cdylib can
# name `backends::ios` for the exported entry points. default-features = false
# keeps the GTK adapter out of the iOS link entirely.
rswidgets = { path = "../../rustxWidgets/rswidgets", default-features = false, features = ["ios"] }

[profile.release]
opt-level = "z"
codegen-units = 1
# `strip = "symbols"` and `lto = "fat"` make release builds small and fast but
# erase every frame name, so a Rust panic in the app prints a backtrace where
# all twelve frames read `_corro_ios_root_ready` (found the hard way, chasing a
# launch abort). Debug information is kept so the simulator's backtrace names
# the actual functions; the binary is not shipped, and the size difference is
# irrelevant next to being able to diagnose a crash.
debug = 1
# lto = "fat" deliberately off for the same reason: it inlines across crates,
# which collapses the very frames one needs to see.
lto = false
